[project]
name = "sigma-ai"
version = "0.1.0"
description = "AI-powered adaptive assessment platform providing personalized diagnostic feedback on Mathematics"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Basyirin Amsyar bin Basri"}
]
keywords = [
    "education",
    "mathematics",
    "artificial-intelligence",
    "machine-learning",
    "adaptive-learning",
    "educational-technology",
    "streamlit",
    "google-gemini",
    "rag",
    "vector-database"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = [
    "google-genai>=1.55.0",
    "pdf2image>=1.17.0",
    "pillow>=12.0.0",
    "python-dotenv>=1.2.1",
    "streamlit>=1.52.1",
    "chromadb>=0.6.0",
    "pypdf>=5.0.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0"
]

[project.urls]
Homepage = "https://github.com/your-username/sigma-ai"
Repository = "https://github.com/your-username/sigma-ai"
Documentation = "https://github.com/your-username/sigma-ai#readme"
"Issue Tracker" = "https://github.com/your-username/sigma-ai/issues"

[project.scripts]
sigma-ai = "sigma_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.ruff]
line-length = 88
target-version = "py313"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
